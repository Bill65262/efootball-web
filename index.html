<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>eFootball ID Shop</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0d1117;
      --surf:    #161b22;
      --surf2:   #1c2128;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --green:   #00e676;
      --orange:  #ff9100;
      --gold:    #ffd700;
      --cyan:    #00e5ff;
      --msg-blue:#0084ff;
    }

    html { height: 100%; overscroll-behavior-y: none; }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    .brandSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .brandLogo {
      height: 44px;
      width: auto;
      max-width: 160px;
      border-radius: 8px;
      object-fit: cover;
      object-position: left center;
    }
    .fbHeaderBtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1877f2;
      color: #fff;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .15s;
    }
    .fbHeaderBtn:hover { opacity: .85; }
    .fbHeaderBtn svg { width: 16px; height: 16px; fill: #fff; }

    /* ──────── TOP ZONE ──────── */
    #topZone {
      display: flex;
      flex-direction: column;
      background: var(--surf);
      flex: 1;
    }

    #tabs {
      display: flex;
      padding: 8px 8px 6px;
      gap: 6px;
      flex-shrink: 0;
    }

    .tabInfo {
      flex: 4;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .tabInfoPages {
      flex: 1;
      display: flex;
      gap: 4px;
      overflow: hidden;
    }
    .tabInfoPage {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 3px 8px rgba(0,0,0,.4);
    }
    .tabInfoLabelBox {
      background: #FF8EE2;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      padding: 3px 4px;
      border-radius: 0;
      letter-spacing: .4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
    .fbIcon {
      width: 17px;
      height: 17px;
      fill: #fff;
      flex-shrink: 0;
    }
    .tabInfoPage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 45% center;
      display: block;
    }
    .tabInfoPageMain img {
      object-position: 40% center;
    }
    .tabInfoCta {
      background: #FF8EE2;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      padding: 4px 0;
      border-radius: 8px;
      letter-spacing: .4px;
      flex-shrink: 0;
      margin-top: 3px;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .tabStack {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tab {
      flex: 1;
      height: auto;
      min-height: 0;
      padding: 0;
      border: none;
      outline: none;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background-color: transparent;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      opacity: 0.6;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
    }
    .tab:active { transform: scale(.95); }
    .tab[data-mode="single"] {
      background-image: url('img/tab_single.png');
      background-size: 112% 112%;
      background-position: center 35%;
    }
    .tab[data-mode="duo"] {
      background-image: url('img/tab_duo.png');
      background-size: 112% 112%;
      background-position: center 65%;
    }
    .tab.active {
      opacity: 1;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 16px rgba(0,229,255,.7), 0 4px 12px rgba(0,0,0,.5);
    }
    /* แท็บที่ยังไม่ได้เลือก: สว่างพอให้รู้ว่ากดได้ (เดิม .6 จางจนลูกค้าคิดว่ากดไม่ได้) */
    .tab:not(.active) { opacity: .9; }

    /* ปุ่มไก่เดี่ยว/ไก่คู่ เด้งเข้า-เด้งออกตลอดเวลา สลับจังหวะกัน (ปุ่มนึงขยาย อีกปุ่มหด)
       ปุ่มที่ยังไม่ได้เลือกเรืองแสงส้ม / ปุ่มที่เลือกอยู่เรืองแสงฟ้าเหมือนเดิม */
    .tab { animation: tabBounce 1.6s ease-in-out infinite; }
    .tab[data-mode="duo"] { animation-delay: -.8s; }
    .tab.active { animation-name: tabBounceActive; }
    /* ใช้ property "scale" (ไม่ใช่ transform) -> ตอนแตะ .tab:active { transform: scale(.95) } ยังยุบให้เห็นได้ */
    @keyframes tabBounce {
      0%, 100% { scale: 1;    box-shadow: 0 0 0 0 rgba(255,145,0,0),     0 4px 12px rgba(0,0,0,.5); }
      50%      { scale: 1.04; box-shadow: 0 0 18px 4px rgba(255,145,0,.9), 0 4px 12px rgba(0,0,0,.5); }
    }
    @keyframes tabBounceActive {
      0%, 100% { scale: 1;    box-shadow: 0 0 10px rgba(0,229,255,.5),       0 4px 12px rgba(0,0,0,.5); }
      50%      { scale: 1.04; box-shadow: 0 0 20px 4px rgba(0,229,255,.9),   0 4px 12px rgba(0,0,0,.5); }
    }

    .tabContent {
      display: none;
    }
    .tabMain {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      line-height: 1;
      letter-spacing: 1px;
    }
    .tabSub {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 5px rgba(0,0,0,.5);
      letter-spacing: 2px;
    }

    #searchRow {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #searchWrap {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
    }
    /* ปุ่มวงกลม ✕ ท้ายช่องค้นหา: ลบแค่คำค้นหา (โชว์เฉพาะตอนมีคำค้น) */
    #searchClear {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: var(--muted);
      color: var(--bg);
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #searchClear:hover { background: var(--text); }
    #searchClear.hidden { display: none; }

    #searchInput {
      flex: 1;
      min-width: 0;
      width: 100%;
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 32px 7px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    #searchInput:focus { border-color: var(--cyan); }
    #searchInput::placeholder { color: var(--muted); }

    #clearBtn {
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 16px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color .15s, border-color .15s;
    }
    #clearBtn:hover { color: var(--text); border-color: var(--muted); }

    .sortBtn {
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 16px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color .15s, border-color .15s, background .15s;
    }
    .sortBtn:hover { color: var(--text); border-color: var(--muted); }
    .sortBtn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }
    .sortBtn:disabled,
    .sortBtn:disabled:hover { opacity: .35; cursor: not-allowed; color: var(--muted); border-color: var(--border); }

    /* ปุ่ม "ลดราคา": แดง-ส้ม มีแสงวิ่ง + เต้นเรืองแสง ให้เตะตา */
    #promoBtn {
      position: relative;
      overflow: hidden;
      color: #fff;
      font-weight: 800;
      border: 1px solid #ff5252;
      background: linear-gradient(90deg, #ff1744, #ff6d00, #ff1744);
      background-size: 200% 100%;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
      animation: promoFlow 2.5s linear infinite, promoPulse 1.2s ease-in-out infinite;
    }
    #promoBtn::after {                 /* แถบแสงวาบวิ่งผ่านปุ่ม */
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: -60%;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      transform: skewX(-20deg);
      animation: promoShine 2.2s ease-in-out infinite;
    }
    #promoBtn:hover { color: #fff; border-color: #fff; }
    #promoBtn.active { border: 2px solid #fff; background: linear-gradient(90deg, #d50000, #ff3d00, #d50000); background-size: 200% 100%; }
    #promoBtn:disabled { animation: none; background: var(--surf2); text-shadow: none; }
    #promoBtn:disabled::after { display: none; }
    @keyframes promoFlow  { from { background-position: 0% 0; } to { background-position: 200% 0; } }
    @keyframes promoPulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,23,68,0); }
      50%      { transform: scale(1.06); box-shadow: 0 0 12px 2px rgba(255,61,0,.8); }
    }
    @keyframes promoShine { 0% { left: -60%; } 60%, 100% { left: 130%; } }

    /* คนที่ตั้งเครื่องให้ลดการเคลื่อนไหว -> ปิดแอนิเมชันเรียกสายตา */
    @media (prefers-reduced-motion: reduce) {
      #promoBtn, #promoBtn::after, .tab { animation: none; }
    }

    #countBadge {
      display: none;
    }

    /* ──────── FILTER ICONS ──────── */
    #filterZone {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 8px 8px;
    }

    #filterGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    @media (min-width: 480px)  { #filterGrid { grid-template-columns: repeat(7,  1fr); } }
    @media (min-width: 720px)  { #filterGrid { grid-template-columns: repeat(10, 1fr); } }
    @media (min-width: 1100px) { #filterGrid { grid-template-columns: repeat(13, 1fr); } }

    .fBtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 9px;
      padding: 2px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .fImg {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      border-radius: 7px;
      background: var(--surf2);
      flex-shrink: 0;
    }
    .fBtn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .fPrice {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      text-align: center;
      line-height: 1.3;
      flex-shrink: 0;
      width: 100%;
    }
    .fBtn span {
      font-size: 10px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }
    .fBtn.active {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0,229,255,.45);
      transform: scale(1.03);
      background: rgba(0,229,255,.05);
    }
    .fBtn:hover:not(.active) { opacity: .75; }

    /* ──────── RESULT ZONE ──────── */
    #resultZone { display: none; }

    body.mode-duo #topZone    { flex: 0 0 50vh; overflow: hidden; min-height: 80px; }
    body.mode-duo #resultZone { display: block; flex: 1; min-height: 80px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body.mode-duo .card-img-wrap { aspect-ratio: 7/6; }
    body.mode-duo .card-img-wrap img { object-fit: cover; }

    /* ──────── DIVIDER ──────── */
    #divider {
      display: none;
      height: 10px;
      background: var(--border);
      cursor: row-resize;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
    }
    #divider::before {
      content: '';
      position: absolute;
      left: 50%;
      top: calc(50% - 8px);
      transform: translateX(-50%);
      width: 50px;
      height: 6px;
      background: linear-gradient(to bottom, #c8c8c8, #909090);
      border-radius: 3px;
      box-shadow: 0 10px 0 #a8a8a8;
      pointer-events: none;
    }
    #divider::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 234px;
      height: 54px;
      background: transparent;
      border-radius: 27px;
    }
    body.mode-duo #divider { display: block; }


    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px;
    }
    @media (min-width: 480px)  { #grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px)  { #grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1100px) { #grid { grid-template-columns: repeat(6, 1fr); } }

    .card {
      position: relative;
      border-radius: 9px;
      overflow: visible;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: transform .15s;
      min-width: 0;
    }
    .card:hover  { transform: scale(1.03); }
    .card:hover .card-img-wrap { box-shadow: 0 4px 20px rgba(0,229,255,.22); border-color: var(--cyan); }
    .card:active { transform: scale(.97); }

    .card-img-wrap {
      aspect-ratio: 3/4;
      overflow: hidden;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surf);
      transition: border-color .15s, box-shadow .15s;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-ov { display: none; }

    .card-info {
      padding: 5px 2px 2px;
      text-align: center;
    }

    .cBadge { display: none; }

    .cName {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.3;
    }

    .cPrice { font-size: 11px; color: var(--gold); font-weight: 700; }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
      gap: 10px;
    }
    .empty-icon { font-size: 44px; }
    .empty p { font-size: 14px; line-height: 1.7; }

    /* ──────── MODAL ──────── */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.87);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    #modal.hidden { display: none; }

    #modalPanel {
      background: var(--surf);
      border-radius: 14px;
      width: 100%;
      max-width: 390px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    #mHead {
      position: sticky;
      top: 0;
      background: var(--surf);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }
    #mHead span { font-size: 14px; font-weight: 600; }

    #mClose {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surf2);
      border: none;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    #mImgWrap { padding: 16px 28px 8px; }

    #mImg {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    #mBody { padding: 4px 16px 28px; }

    .mBadge {
      display: inline-block;
      background: #c49000;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      margin: 10px 0 6px;
    }

    .mName  { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 2px; line-height: 1.2; }
    .mGame  { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    .mPriceLabel { font-size: 12px; color: var(--muted); margin-bottom: 2px; }

    .mPriceRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mPrice { font-size: 28px; font-weight: 700; color: var(--gold); }

    .msgBtnWrap {
      display: grid;
      grid-template-columns: auto 46px 46px;
      column-gap: 6px;
      row-gap: 16px;
      align-items: center;
      flex-shrink: 0;
    }
    .pageGroup { display: contents; }
    .pageBtns  { display: contents; }
    .pageLabel {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.5;
      text-align: right;
      white-space: nowrap;
    }
    .pageLabel small {
      display: block;
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
    }
    .msgBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0084ff, #44bfff);
      box-shadow: 0 4px 14px rgba(0,132,255,.5);
      text-decoration: none;
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .msgBtn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(0,132,255,.65); }
    .msgBtn svg { width: 26px; height: 26px; fill: #fff; }
    .fbBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #1877f2;
      box-shadow: 0 4px 14px rgba(24,119,242,.5);
      text-decoration: none;
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .fbBtn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(24,119,242,.65); }
    .fbBtn svg { width: 26px; height: 26px; fill: #fff; }

    .mStock      { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .mDescTitle  { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .mDescList   { list-style: none; font-size: 13px; color: var(--muted); line-height: 2; }
    .mDescList li::before { content: "-"; margin-right: 6px; }

    /* loading */
    #loader {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--muted);
      font-size: 14px;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ──────── FLOATING ADMIN BUTTON ──────── */
    #fabAdmin {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    #fabAdmin .fabCircle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff5252, #ff1744);
      box-shadow: 0 4px 14px rgba(255,23,68,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      line-height: 1;
      transition: transform .15s, box-shadow .15s;
    }
    #fabAdmin:hover .fabCircle { transform: scale(1.08); box-shadow: 0 6px 18px rgba(255,23,68,.65); }

</head>

<script>
'use strict';

/* ── HELPERS ── */
function displayName(n) {
  const override = { 'ZlaN': 'Zlatan', 'RooneyOld': 'Rooney' };
  if (override[n]) return override[n];
  return n && n.endsWith('NN') ? n.slice(0, -2) : n.endsWith('N') ? n.slice(0, -1) : n;
}

/* ── CONFIG ── */
const MESSENGER_URL  = 'https://m.me/mook.mook.435051';
const FACEBOOK_URL   = 'https://www.facebook.com/share/18ZbWnzzH4/?mibextid=wwXIfr';
const MESSENGER_URL2 = 'https://m.me/meena.meena.7523';
const FACEBOOK_URL2  = 'https://www.facebook.com/meena.meena.7523';
const PAGE_SIZE     = 60;
const SINGLE_IMG    = '../assets/template/single/';
const DUO_IMG       = '../assets/template/duo/';

/* ── STATE ── */
let allItems  = [];
let tagIndex  = {};
let mode      = 'single';
let selected  = new Set();
let query     = '';
let sortOrder = 'default';
let promoFirst = false;   // ปุ่ม "ลดราคา": ไอดีบราซิลขึ้นก่อน
let page      = 1;
let filtered  = [];

/* ── STORE-WIDE SALE ──
   data/discount.json = { enabled, percent, ends_at_ms } ตั้งจาก Manager
   ราคาจริงใน json ไม่ถูกแก้ — ลดเฉพาะตอนแสดงผล และกลับเป็นราคาเดิมเองทันทีที่หมดเวลา
   เวลาใช้ของเซิร์ฟเวอร์ (header Date) ไม่ใช่นาฬิกาเครื่องลูกค้า -> ทุกคนหมดเวลาพร้อมกัน */
let sale        = null;   // { percent, startMs, endsMs }
let saleWasActive = false; // สถานะตอน tick ก่อน -> รู้ว่าเพิ่งเริ่ม/เพิ่งหมด จะได้วาดราคาใหม่
let clockOffset = 0;      // เวลาเซิร์ฟเวอร์ - เวลาเครื่องลูกค้า (ms)
let modalId     = null;
const nowMs = () => Date.now() + clockOffset;

function saleActive() { return !!sale && nowMs() >= sale.startMs && nowMs() < sale.endsMs; }

/* ── ไอดีบราซิล ──
   data/brazil.json = { players: [...], percent } ตั้งจาก Manager
   ไอดีที่มีนักเตะในรายชื่อ (ไก่เดี่ยวหรือคอมโบ) ลดถาวร และลดซ้อนกับลดราคาทั้งร้านได้ */
let brazilSet = new Set();
let brazilPct = 0;

async function loadBrazil() {
  try {
    const res = await fetch('data/brazil.json', { cache: 'no-store' });
    if (!res.ok) return;
    const b = await res.json();
    if (b.percent > 0 && Array.isArray(b.players)) {
      brazilSet = new Set(b.players);
      brazilPct = b.percent;
    }
  } catch (e) { /* ไม่มีไฟล์ = ไม่มีไอดีบราซิล */ }
}

function isBrazil(p) { return brazilPct > 0 && (p.players || []).some(n => brazilSet.has(n)); }

// ธงบราซิลเป็น SVG (อีโมจิ 🇧🇷 บน Windows จะขึ้นเป็นตัวอักษร BR)
const BR_FLAG = '<svg class="idFlag" viewBox="0 0 20 14" aria-hidden="true">' +
  '<rect width="20" height="14" rx="2" fill="#009c3b"/>' +
  '<path d="M10 1.6 18.4 7 10 12.4 1.6 7z" fill="#ffdf00"/>' +
  '<circle cx="10" cy="7" r="3.1" fill="#002776"/></svg>';
// ธงไทย: แดง-ขาว-น้ำเงิน(หนา 2 เท่า)-ขาว-แดง
const TH_FLAG = '<svg class="idFlag" viewBox="0 0 20 14" aria-hidden="true">' +
  '<rect width="20" height="14" rx="2" fill="#a51931"/>' +
  '<rect y="2.33" width="20" height="9.34" fill="#f4f5f8"/>' +
  '<rect y="4.67" width="20" height="4.66" fill="#2d2a4a"/></svg>';

let brToastTimer = null;
function showBrToast() {
  const t = document.getElementById('brToast');
  t.innerHTML = `${BR_FLAG}<div class="brTitle">ไอดีบราซิล</div>` +
                `<div class="brSub">ไอดีนี้ไม่ใช่ไอดีไทย · ลดราคาพิเศษ ${brazilPct}%</div>`;
  t.classList.remove('show');
  void t.offsetWidth;                    // เริ่มแอนิเมชันเด้งใหม่ทุกครั้งที่เปิด
  t.classList.add('show');
  clearTimeout(brToastTimer);
  brToastTimer = setTimeout(hideBrToast, 3000);
}
function hideBrToast() {
  clearTimeout(brToastTimer);
  document.getElementById('brToast').classList.remove('show');
}

// ปุ่ม "ลดราคา" มีผลเฉพาะช่วงปกติ — ช่วงลดทั้งร้านทุกไอดีลดอยู่แล้ว ปุ่มจึงกดไม่ได้
function promoAvailable() { return brazilPct > 0 && !saleActive(); }
function promoActive() { return promoFirst && promoAvailable(); }
function updatePromoBtn() {
  const btn = document.getElementById('promoBtn');
  btn.disabled = !promoAvailable();
  btn.classList.toggle('active', promoActive());
}

// ส่วนลดที่ใช้กับไอดีนี้ตอนนี้ ตามลำดับที่ลดซ้อนกัน (บราซิลก่อน แล้วค่อยลดทั้งร้าน)
function discountsFor(p) {
  const out = [];
  if (isBrazil(p)) out.push(brazilPct);
  if (saleActive()) out.push(sale.percent);
  return out;
}

// ราคาหลังลดทุกชั้น (ปัดเป็นบาทเต็มทีละชั้น)
function finalPrice(p) {
  return discountsFor(p).reduce((price, pct) => Math.round(price * (100 - pct) / 100), p.price || 0);
}

// % ลดรวม สำหรับป้าย เช่น 50% แล้ว 10% = ลด 55%
function totalPct(p) {
  const keep = discountsFor(p).reduce((k, pct) => k * (100 - pct) / 100, 1);
  return Math.round((1 - keep) * 100);
}

// แสดงแค่ราคาเดิม (ขีดฆ่า) กับราคาสุดท้าย สลับกัน — ไม่แสดงราคาขั้นกลาง
function priceHTML(p) {
  if (!p || !p.price) return '';
  if (!discountsFor(p).length) return `${p.price} บาท`;
  return `<span class="pSale"><span class="pOld">${p.price} บาท</span>` +
         `<span class="pNew">${finalPrice(p)} บาท</span></span>`;
}

async function loadSale() {
  try {
    const res = await fetch('data/discount.json', { cache: 'no-store' });
    const server = Date.parse(res.headers.get('Date'));
    if (!isNaN(server)) clockOffset = server - Date.now();
    if (!res.ok) return;
    const d = await res.json();
    if (d.enabled && d.percent > 0 && d.ends_at_ms > nowMs())
      sale = { percent: d.percent, startMs: d.starts_at_ms || 0, endsMs: d.ends_at_ms };
  } catch (e) { /* ไม่มีไฟล์ = ไม่มีลดราคา */ }
  saleWasActive = saleActive();
}

function fmtLeft(ms) {
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), sec = s % 60;
  const pad = n => String(n).padStart(2, '0');
  return (d ? `${d} วัน ` : '') + `${pad(h)} ชม. ${pad(m)} นาที ${pad(sec)} วินาที`;
}

function tickSale() {
  const bar = document.getElementById('saleBar');
  const active = saleActive();
  if (active !== saleWasActive) {
    // เพิ่งถึงเวลาเริ่ม หรือเพิ่งหมดเวลา -> วาดราคาใหม่ทั้งหน้า (ไม่ต้องรีเฟรช)
    saleWasActive = active;
    if (active) promoFirst = false;   // เริ่มลดทั้งร้าน -> ปุ่มลดราคากลับเป็นปิด (ไม่ค้างไว้ไปเปิดเองตอนจบ)
    updatePromoBtn();
    renderFilters();
    runFilter();
    if (!document.getElementById('modal').classList.contains('hidden') && modalId !== null) openModal(modalId, true);
  }
  if (sale && nowMs() >= sale.endsMs) sale = null;
  if (!active) { bar.classList.add('hidden'); return; }   // ก่อนเริ่ม/หลังหมด: ไม่แสดงอะไรเลย
  const left = sale.endsMs - nowMs();
  document.getElementById('saleText').textContent = 'ลดราคาทุกไอดี เหลือเวลา';
  document.getElementById('saleTime').textContent = fmtLeft(left);
  bar.classList.remove('hidden');
  const mLeft = document.getElementById('mSaleLeft');
  if (mLeft) mLeft.textContent = `⏰ ส่วนลดหมดในอีก ${fmtLeft(left)}`;
}

/* ── HELPERS ── */
function imgURL(base, filename) {
  /* encodeURI preserves + sign (literal in filename) but encodes spaces */
  return base + encodeURI(filename);
}

/* ── LOAD DATA ── */
async function loadData() {
  try {
    const v = Date.now();
    const [rp, rs, rd, rc] = await Promise.all([
      fetch('data/playersdata.json?v=' + v),
      fetch('data/singleplayers.json?v=' + v),
      fetch('data/duoplayers.json?v=' + v),
      fetch('data/duocombos.json?v=' + v)
    ]);
    if (!rp.ok || !rs.ok || !rd.ok || !rc.ok) throw new Error();
    const playersData  = await rp.json();
    const singleStatus = await rs.json();
    const duoData      = await rd.json();
    const duoCombos    = await rc.json();

    const singleMap    = {};
    singleStatus.forEach(s => { singleMap[s.name] = s; });
    const duoPlayerMap = {};
    duoData.players.forEach(d => { duoPlayerMap[d.name] = d; });

    const singleItems = playersData.map((p, i) => {
      const s = singleMap[p.name] || {};
      return { id: 10000 + i, type: 'single', name: p.name, card_img: p.card_img,
               players: p.players, price: s.price ?? 0, status: s.status || 'available' };
    });

    const duoPlayerItems = playersData.map((p, i) => {
      const d = duoPlayerMap[p.name] || {};
      return { id: 5000 + i, type: 'duo', name: p.name, card_img: p.card_img,
               players: p.players, price: d.price ?? 0, status: d.status || 'available' };
    });

    const duoComboItems = duoCombos.map(c => ({
      id: 100000 + c.id, type: 'duo', name: c.players.join('+'), card_img: c.card_img,
      players: c.players, price: c.price ?? 0, status: c.status || 'available'
    }));

    allItems = [...singleItems, ...duoPlayerItems, ...duoComboItems];
  } catch {
    allItems = SEED_DATA;
  }
  buildIndex();
}

function buildIndex() {
  tagIndex = {};
  allItems.forEach(item => {
    (item.players || []).forEach(tag => {
      if (!tagIndex[tag]) tagIndex[tag] = [];
      tagIndex[tag].push(item);
    });
  });
}

/* ── FILTER LOGIC ── */
function computeFiltered() {
  let res = allItems.filter(p =>
    p.type === mode && p.status !== 'sold' &&
    (mode !== 'duo' || p.players.length > 1)
  );

  if (mode === 'duo' && selected.size > 0) {
    res = res.filter(p => [...selected].every(tag => p.players.includes(tag)));
  }

  if (query) {
    const q = query.toLowerCase();
    res = res.filter(p => {
      const name = (p.name || '').toLowerCase();
      const players = (p.players || []).map(x => x.toLowerCase());
      return name.includes(q) || players.some(x => x.includes(q));
    });
  }

  // เรียงตามราคาที่ลูกค้าจ่ายจริง (ไอดีบราซิลลดคนละแบบกับไอดีอื่น ลำดับจึงเปลี่ยนได้)
  if (sortOrder === 'price_desc') res = [...res].sort((a, b) => finalPrice(b) - finalPrice(a));
  else if (sortOrder === 'price_asc') res = [...res].sort((a, b) => finalPrice(a) - finalPrice(b));

  // ไอดีบราซิลขึ้นก่อน ที่เหลือต่อท้าย (ในแต่ละกลุ่มยังเรียงตามปุ่มราคาเหมือนเดิม)
  if (promoActive()) res = [...res.filter(isBrazil), ...res.filter(p => !isBrazil(p))];

  return res;
}

/* ── UNIQUE TAGS FOR CURRENT MODE ── */
function tagsForMode() {
  const seen = new Set();
  const out  = [];
  allItems
    .filter(p => (mode === 'duo' ? (p.type === 'duo' && p.players.length === 1) : p.type === mode) && p.status !== 'sold')
    .forEach(p => {
      (p.players || []).forEach(tag => {
        if (!seen.has(tag)) { seen.add(tag); out.push(tag); }
      });
    });
  return out;
}

/* ── RENDER FILTER ICONS ── */
function renderFilters() {
  const fg = document.getElementById('filterGrid');
  fg.innerHTML = '';
  const frag = document.createDocumentFragment();

  let tags;
  if (mode === 'duo' && selected.size > 0) {
    const seen = new Set();
    const out  = [];
    selected.forEach(t => { if (!seen.has(t)) { seen.add(t); out.push(t); } });
    filtered.forEach(item => {
      (item.players || []).forEach(t => {
        if (!seen.has(t)) { seen.add(t); out.push(t); }
      });
    });
    tags = query ? out.filter(t => t.toLowerCase().includes(query)) : out;
  } else {
    const allTags = tagsForMode();
    tags = query ? allTags.filter(t => t.toLowerCase().includes(query)) : allTags;
  }

  if (mode === 'single' && sortOrder !== 'default') {
    tags = [...tags].sort((a, b) => {
      const ia = allItems.find(p => p.type === 'single' && p.name === a);
      const ib = allItems.find(p => p.type === 'single' && p.name === b);
      const pa = ia ? finalPrice(ia) : 0;
      const pb = ib ? finalPrice(ib) : 0;
      return sortOrder === 'price_desc' ? pb - pa : pa - pb;
    });
  }
  if (mode === 'single' && promoActive()) {
    tags = [...tags.filter(t => brazilSet.has(t)), ...tags.filter(t => !brazilSet.has(t))];
  }

  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'fBtn' + (selected.has(tag) ? ' active' : '');
    btn.dataset.tag = tag;
    btn.title = tag;

    const imgWrap = document.createElement('div');
    imgWrap.className = 'fImg';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = imgURL(SINGLE_IMG, tag + '.png');
    img.alt = tag;
    img.onerror = function () { this.style.opacity = '0.2'; };
    imgWrap.appendChild(img);

    const lbl = document.createElement('span');
    lbl.textContent = displayName(tag);

    if (mode === 'single') {
      const item = allItems.find(p => p.type === 'single' && p.name === tag);
      const pEl = document.createElement('div');
      pEl.className = 'fPrice';
      pEl.innerHTML = priceHTML(item);
      btn.append(imgWrap, pEl, lbl);
    } else {
      btn.append(imgWrap, lbl);
    }

    btn.addEventListener('click', () => toggleTag(tag, btn));
    frag.appendChild(btn);
  });

  fg.appendChild(frag);
}

/* ── TOGGLE TAG ── */
function toggleTag(tag, btn) {
  if (mode === 'single') {
    const matches = (tagIndex[tag] || []).filter(p => p.type === 'single' && p.status !== 'sold');
    if (matches.length > 0) openModal(matches[0].id);
  } else {
    if (selected.has(tag)) { selected.delete(tag); btn.classList.remove('active'); }
    else                   { selected.add(tag);    btn.classList.add('active');    }
    runFilter(true);
    renderFilters();
  }
}

function updateSortBtns() {
  const btn = document.getElementById('sortBtn');
  btn.classList.toggle('active', sortOrder !== 'default');
  btn.textContent = sortOrder === 'price_desc' ? '↓ แพง→ถูก'
                  : sortOrder === 'price_asc'  ? '↑ ถูก→แพง'
                  : '⇅ ราคา';
}

function syncSearchClear() {

/* ── RENDER GRID ── */
function createCard(p) {
  const base = (p.type === 'duo' && p.players.length > 1) ? DUO_IMG : SINGLE_IMG;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = p.id;

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = imgURL(base, p.card_img);
  img.alt = p.name;
  img.onerror = function () { this.style.opacity = '0'; };

  const dName = (p.players && p.players.length > 1)
    ? p.players.map(pl => displayName(pl)).join('+')
    : displayName(p.name);

  const imgWrap = document.createElement('div');
  imgWrap.className = 'card-img-wrap';
  imgWrap.appendChild(img);

  const info = document.createElement('div');
  info.className = 'card-info';
  info.innerHTML =
    `<div class="cName">${dName}</div>` +
    (p.price ? `<div class="cPrice">${priceHTML(p)}</div>` : '');

  card.append(imgWrap, info);
  card.addEventListener('click', () => openModal(p.id));
  return card;
}

function renderGrid(reset) {
  const grid = document.getElementById('grid');

  if (reset) {
    page = 1;
    grid.innerHTML = '';
  }

  document.getElementById('countBadge').textContent = filtered.length + ' ไอดี';

  if (filtered.length === 0) {
    grid.innerHTML =
      `<div class="empty">
         <div class="empty-icon">⚽</div>
         <p>ไม่พบไอดีที่ตรงกัน<br>ลองเปลี่ยนนักเตะที่กรอง</p>
       </div>`;
    return;
  }

  const start = (page - 1) * PAGE_SIZE;
  const slice = filtered.slice(start, page * PAGE_SIZE);
  const frag  = document.createDocumentFragment();
  slice.forEach(p => frag.appendChild(createCard(p)));
  grid.appendChild(frag);
}

function runFilter(reset = true) {
  filtered = computeFiltered();
  page = 1;
  renderGrid(true);
}

/* ── DIVIDER DRAG ── */
function initDivider() {
  const divider = document.getElementById('divider');
  const topZone = document.getElementById('topZone');
  let dragging = false, startY = 0, startH = 0;

  function startDrag(y) {
    dragging = true;
    startY = y;
    startH = topZone.getBoundingClientRect().height;
  }
  function moveDrag(y) {
    if (!dragging) return;
    const delta = y - startY;
    const newH  = Math.max(80, Math.min(window.innerHeight - 80, startH + delta));
    topZone.style.flex = '0 0 ' + newH + 'px';
  }
  function endDrag() { dragging = false; }

  divider.addEventListener('mousedown',  e => { startDrag(e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => moveDrag(e.clientY));
  document.addEventListener('mouseup',   endDrag);

  divider.addEventListener('touchstart', e => { startDrag(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (dragging) { moveDrag(e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
  document.addEventListener('touchend',  endDrag);
}

/* ── EVENTS ── */
function initEvents() {
  /* mode tabs */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.mode === mode) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      mode = tab.dataset.mode;
      document.body.classList.toggle('mode-duo', mode === 'duo');
      document.getElementById('topZone').style.flex = '';
      selected.clear();
      query = '';
      document.getElementById('searchInput').value = '';
      syncSearchClear();
      renderFilters();
      runFilter();
    });
  });

  /* search */
  document.getElementById('searchInput').addEventListener('input', e => {
    query = e.target.value.toLowerCase().trim();
    syncSearchClear();
    renderFilters();
    runFilter(true);
  });

  /* ✕ ท้ายช่องค้นหา: ลบแค่คำค้นหา — นักเตะ/คอมโบที่เลือกไว้ และการเรียงราคา ยังอยู่ */
  document.getElementById('searchClear').addEventListener('click', () => {
    const input = document.getElementById('searchInput');
    input.value = '';
    query = '';
    syncSearchClear();
    renderFilters();
    runFilter(true);
  });

  /* ลดราคา: ไอดีบราซิลขึ้นก่อน / กดซ้ำ = ยกเลิก */
  document.getElementById('promoBtn').addEventListener('click', () => {
    promoFirst = !promoFirst;
    updatePromoBtn();
    renderFilters();
    runFilter();
  });

  /* sort: แพง→ถูก ครั้งแรก แล้วสลับ ถูก→แพง / แพง→ถูก ไปเรื่อยๆ */
  document.getElementById('sortBtn').addEventListener('click', () => {
    sortOrder = sortOrder === 'price_desc' ? 'price_asc' : 'price_desc';
    updateSortBtns();
    renderFilters();
    runFilter();
  });


  /* clear */
  document.getElementById('clearBtn').addEventListener('click', () => {
    selected.clear();
    query = '';
    sortOrder = 'default';
    promoFirst = false;
    document.getElementById('searchInput').value = '';
    syncSearchClear();
    updateSortBtns();
    updatePromoBtn();
    renderFilters();
    runFilter();
  });

  /* infinite scroll */
  document.getElementById('resultZone').addEventListener('scroll', e => {
    const el = e.currentTarget;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 300) {
      if (page * PAGE_SIZE < filtered.length) {
        page++;
        renderGrid(false);
      }
    }
  }, { passive: true });

  /* modal close */
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('brToast').addEventListener('click', hideBrToast);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

/* ── ANNOUNCEMENT POPUP ── */
async function initAnnouncement() {
  try {
    const res = await fetch('data/announcement.json', { cache: 'no-store' });
    if (!res.ok) return;
    const a = await res.json();
    // รูปแบบใหม่มี popups[] (หลายอัน) — รูปแบบเก่ามีแค่ enabled/message
    const list = Array.isArray(a.popups) ? a.popups : [a];
    announceQueue = list.filter(p => p.enabled &&
      (p.type === 'image' ? !!p.image : (p.message || '').trim()));
    announceTotal = announceQueue.length;
    // เริ่มโหลดรูปป๊อบอัพทุกอันไว้ก่อน -> อันที่ 2, 3 ขึ้นทันทีไม่ต้องรอ
    announceQueue.filter(p => p.type === 'image').forEach(p => { new Image().src = p.image; });
    showNextAnnouncement();
  } catch (e) { /* no announcement file yet — ignore */ }
}
let announceQueue = [];
let announceTotal = 0;
let announceSeq   = 0;      // กันรูปอันก่อนที่โหลดเสร็จช้า มาโผล่ทับอันปัจจุบัน
let announceTimer = null;
const ANNOUNCE_IMG_TIMEOUT = 8000;   // โหลดรูปเกิน 8 วิ -> ข้ามให้เอง ไม่ให้ลูกค้าเจอจอมืดค้าง
function showNextAnnouncement() {
  const overlay = document.getElementById('announceOverlay');
  const panel = document.getElementById('announcePanel');
  const img = document.getElementById('announceImg');
  const spin = document.getElementById('announceSpin');
  const seq = ++announceSeq;
  clearTimeout(announceTimer);
  img.onload = img.onerror = null;
  spin.classList.add('hidden');
  const p = announceQueue.shift();
  if (!p) { overlay.classList.add('hidden'); return; }
  if (p.type === 'image') {
    panel.classList.add('hidden');
    img.classList.add('hidden');          // โชว์ตอนโหลดรูปเสร็จ ไม่ให้เห็นกรอบว่าง
    spin.classList.remove('hidden');
    img.onload = () => {
      if (seq !== announceSeq) return;
      clearTimeout(announceTimer);
      spin.classList.add('hidden');
      img.classList.remove('hidden');
    };
    img.onerror = () => { if (seq === announceSeq) showNextAnnouncement(); };  // รูปหาย -> ข้าม
    announceTimer = setTimeout(() => { if (seq === announceSeq && img.classList.contains('hidden')) showNextAnnouncement(); },
                               ANNOUNCE_IMG_TIMEOUT);
    img.src = p.image;
    if (img.complete && img.naturalWidth) img.onload();   // รูปอยู่ในแคชแล้ว
  } else {
    img.classList.add('hidden');
    panel.classList.remove('hidden');
    const n = announceTotal - announceQueue.length;
    document.getElementById('announceCount').textContent = announceTotal > 1 ? `(${n}/${announceTotal})` : '';
    document.getElementById('announceBody').textContent = p.message;
  }
  overlay.classList.remove('hidden');
}
document.getElementById('announceClose').addEventListener('click', showNextAnnouncement);
document.getElementById('announceImg').addEventListener('click', showNextAnnouncement);
// แตะพื้นมืดรอบๆ = ข้าม/ปิดป๊อบอัพนี้ (ใช้ได้ทั้งตอนกำลังโหลดรูป และตอนแสดงแล้ว)
document.getElementById('announceOverlay').addEventListener('click', e => {
  if (e.target.id === 'announceOverlay' || e.target.id === 'announceSpin') showNextAnnouncement();
});
