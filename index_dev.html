<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>eFootball ID Shop</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0d1117;
      --surf:    #161b22;
      --surf2:   #1c2128;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --green:   #00e676;
      --orange:  #ff9100;
      --gold:    #ffd700;
      --cyan:    #00e5ff;
      --msg-blue:#0084ff;
    }

    html { height: 100%; overscroll-behavior-y: none; }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    .brandSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .brandLogo {
      height: 44px;
      width: auto;
      max-width: 160px;
      border-radius: 8px;
      object-fit: cover;
      object-position: left center;
    }
    .fbHeaderBtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1877f2;
      color: #fff;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .15s;
    }
    .fbHeaderBtn:hover { opacity: .85; }
    .fbHeaderBtn svg { width: 16px; height: 16px; fill: #fff; }

    /* ──────── TOP ZONE ──────── */
    #topZone {
      display: flex;
      flex-direction: column;
      background: var(--surf);
      flex: 1;
    }

    #tabs {
      display: flex;
      padding: 8px 8px 6px;
      gap: 6px;
      flex-shrink: 0;
    }

    .tabInfo {
      flex: 4;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .tabInfoPages {
      flex: 1;
      display: flex;
      gap: 4px;
      overflow: hidden;
    }
    .tabInfoPage {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 3px 8px rgba(0,0,0,.4);
    }
    .tabInfoLabelBox {
      background: #FF8EE2;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      padding: 3px 4px;
      border-radius: 0;
      letter-spacing: .4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
    .fbIcon {
      width: 17px;
      height: 17px;
      fill: #fff;
      flex-shrink: 0;
    }
    .tabInfoPage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 45% center;
      display: block;
    }
    .tabInfoPageMain img {
      object-position: 40% center;
    }
    .tabInfoCta {
      background: #FF8EE2;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      padding: 4px 0;
      border-radius: 8px;
      letter-spacing: .4px;
      flex-shrink: 0;
      margin-top: 3px;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .tabStack {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tab {
      flex: 1;
      height: auto;
      min-height: 0;
      padding: 0;
      border: none;
      outline: none;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background-color: transparent;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      opacity: 0.6;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
    }
    .tab:active { transform: scale(.95); }
    .tab[data-mode="single"] {
      background-image: url('img/tab_single.png');
      background-size: 112% 112%;
      background-position: center 35%;
    }
    .tab[data-mode="duo"] {
      background-image: url('img/tab_duo.png');
      background-size: 112% 112%;
      background-position: center 65%;
    }
    .tab.active {
      opacity: 1;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 16px rgba(0,229,255,.7), 0 4px 12px rgba(0,0,0,.5);
    }

    .tabContent {
      display: none;
    }
    .tabMain {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      line-height: 1;
      letter-spacing: 1px;
    }
    .tabSub {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 5px rgba(0,0,0,.5);
      letter-spacing: 2px;
    }

    #searchRow {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    #searchInput:focus { border-color: var(--cyan); }
    #searchInput::placeholder { color: var(--muted); }

    #clearBtn {
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 16px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color .15s, border-color .15s;
    }
    #clearBtn:hover { color: var(--text); border-color: var(--muted); }

    .sortBtn {
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 16px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color .15s, border-color .15s, background .15s;
    }
    .sortBtn:hover { color: var(--text); border-color: var(--muted); }
    .sortBtn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }

    #countBadge {
      display: none;
    }

    /* ──────── FILTER ICONS ──────── */
    #filterZone {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 8px 8px;
    }

    #filterGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    @media (min-width: 480px)  { #filterGrid { grid-template-columns: repeat(7,  1fr); } }
    @media (min-width: 720px)  { #filterGrid { grid-template-columns: repeat(10, 1fr); } }
    @media (min-width: 1100px) { #filterGrid { grid-template-columns: repeat(13, 1fr); } }

    .fBtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 9px;
      padding: 2px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .fImg {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      border-radius: 7px;
      background: var(--surf2);
      flex-shrink: 0;
    }
    .fBtn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .fPrice {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      text-align: center;
      line-height: 1.3;
      flex-shrink: 0;
      width: 100%;
    }
    .fBtn span {
      font-size: 10px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }
    .fBtn.active {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0,229,255,.45);
      transform: scale(1.03);
      background: rgba(0,229,255,.05);
    }
    .fBtn:hover:not(.active) { opacity: .75; }

    /* ──────── RESULT ZONE ──────── */
    #resultZone { display: none; }

    body.mode-duo #topZone    { flex: 0 0 50vh; overflow: hidden; min-height: 80px; }
    body.mode-duo #resultZone { display: block; flex: 1; min-height: 80px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body.mode-duo .card-img-wrap { aspect-ratio: 7/6; }
    body.mode-duo .card-img-wrap img { object-fit: cover; }

    /* ──────── DIVIDER ──────── */
    #divider {
      display: none;
      height: 10px;
      background: var(--border);
      cursor: row-resize;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
    }
    #divider::before {
      content: '';
      position: absolute;
      left: 50%;
      top: calc(50% - 8px);
      transform: translateX(-50%);
      width: 50px;
      height: 6px;
      background: linear-gradient(to bottom, #c8c8c8, #909090);
      border-radius: 3px;
      box-shadow: 0 10px 0 #a8a8a8;
      pointer-events: none;
    }
    #divider::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 234px;
      height: 54px;
      background: transparent;
      border-radius: 27px;
    }
    body.mode-duo #divider { display: block; }


    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px;
    }
    @media (min-width: 480px)  { #grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px)  { #grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1100px) { #grid { grid-template-columns: repeat(6, 1fr); } }

    .card {
      position: relative;
      border-radius: 9px;
      overflow: visible;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: transform .15s;
      min-width: 0;
    }
    .card:hover  { transform: scale(1.03); }
    .card:hover .card-img-wrap { box-shadow: 0 4px 20px rgba(0,229,255,.22); border-color: var(--cyan); }
    .card:active { transform: scale(.97); }

    .card-img-wrap {
      aspect-ratio: 3/4;
      overflow: hidden;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surf);
      transition: border-color .15s, box-shadow .15s;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-ov { display: none; }

    .card-info {
      padding: 5px 2px 2px;
      text-align: center;
    }

    .cBadge { display: none; }

    .cName {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.3;
    }

    .cPrice { font-size: 11px; color: var(--gold); font-weight: 700; }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
      gap: 10px;
    }
    .empty-icon { font-size: 44px; }
    .empty p { font-size: 14px; line-height: 1.7; }

    /* ──────── MODAL ──────── */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.87);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    #modal.hidden { display: none; }

    #modalPanel {
      background: var(--surf);
      border-radius: 14px;
      width: 100%;
      max-width: 390px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    #mHead {
      position: sticky;
      top: 0;
      background: var(--surf);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }
    #mHead span { font-size: 14px; font-weight: 600; }

    #mClose {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surf2);
      border: none;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    #mImgWrap { padding: 16px 28px 8px; }

    #mImg {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    #mBody { padding: 4px 16px 28px; }

    .mBadge {
      display: inline-block;
      background: #c49000;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      margin: 10px 0 6px;
    }

    .mName  { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 2px; line-height: 1.2; }
    .mGame  { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    .mPriceLabel { font-size: 12px; color: var(--muted); margin-bottom: 2px; }

    .mPriceRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mPrice { font-size: 28px; font-weight: 700; color: var(--gold); }

    .msgBtnWrap {
      display: grid;
      grid-template-columns: auto 46px 46px;
      column-gap: 6px;
      row-gap: 16px;
      align-items: center;
      flex-shrink: 0;
    }
    .pageGroup { display: contents; }
    .pageBtns  { display: contents; }
    .pageLabel {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.5;
      text-align: right;
      white-space: nowrap;
    }
    .pageLabel small {
      display: block;
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
    }
    .msgBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0084ff, #44bfff);
      box-shadow: 0 4px 14px rgba(0,132,255,.5);
      text-decoration: none;
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .msgBtn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(0,132,255,.65); }
    .msgBtn svg { width: 26px; height: 26px; fill: #fff; }
    .fbBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #1877f2;
      box-shadow: 0 4px 14px rgba(24,119,242,.5);
      text-decoration: none;
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .fbBtn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(24,119,242,.65); }
    .fbBtn svg { width: 26px; height: 26px; fill: #fff; }

    .mStock      { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .mDescTitle  { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .mDescList   { list-style: none; font-size: 13px; color: var(--muted); line-height: 2; }
    .mDescList li::before { content: "-"; margin-right: 6px; }

    /* loading */
    #loader {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--muted);
      font-size: 14px;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ──────── FLOATING ADMIN BUTTON ──────── */
    #fabAdmin {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    #fabAdmin .fabCircle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff5252, #ff1744);
      box-shadow: 0 4px 14px rgba(255,23,68,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      line-height: 1;
      transition: transform .15s, box-shadow .15s;
    }
    #fabAdmin:hover .fabCircle { transform: scale(1.08); box-shadow: 0 6px 18px rgba(255,23,68,.65); }
    #fabAdmin:active .fabCircle { transform: scale(.95); }
    #fabAdmin .fabLabel {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #000;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>


<!-- ── TOP: sticky filter zone ── -->
<div id="topZone">
  <div id="tabs">
    <div class="tabInfo">
      <div class="tabInfoPages">
        <a href="https://www.facebook.com/share/18ZbWnzzH4/?mibextid=wwXIfr" target="_blank" class="tabInfoPage tabInfoPageMain">
          <div class="tabInfoLabelBox"><svg class="fbIcon" viewBox="0 0 24 24"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.268h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg> หลัก</div>

      </div>
      <div class="tabInfoCta">ติดต่อสอบถามกดที่รูปได้เลย!</div>
    </div>
    <div class="tabStack">
      <button class="tab active" data-mode="single">
        <div class="tabContent">
          <div class="tabMain">ไก่</div>
          <div class="tabSub">เดี่ยว</div>

        <div class="tabContent">
          <div class="tabMain">ไก่</div>

      </button>
    </div>
  </div>
  <div id="searchRow">
    <input id="searchInput" type="text" placeholder="🔍 ค้นหานักเตะ..." autocomplete="off" spellcheck="false">
    <button class="sortBtn" id="sortDesc">↓ ราคา</button>
    <button class="sortBtn" id="sortAsc">↑ ราคา</button>

    <div id="filterGrid"></div>

<!-- ── DIVIDER (duo mode only) ── -->
<div id="divider"></div>

<!-- ── BOTTOM: results ── -->
<div id="resultZone">
  <div id="grid"><div id="loader">กำลังโหลด...</div></div>
</div>

<!-- ── MODAL ── -->
<div id="modal" class="hidden" role="dialog" aria-modal="true">
  <div id="modalPanel">
    <div id="mHead">
      <span>รายละเอียดสินค้า</span>
      <button id="mClose" aria-label="ปิด">✕</button>
    </div>

      <img id="mImg" src="" alt="">
    </div>

  </div>

  return base + encodeURI(filename);

/* ── LOAD DATA ── */
async function loadData() {

    if (!rp.ok || !rs.ok || !rd.ok || !rc.ok) throw new Error();
    const playersData  = await rp.json();
    const singleStatus = await rs.json();
    const duoData      = await rd.json();
    const duoCombos    = await rc.json();

    const singleMap    = {};
    singleStatus.forEach(s => { singleMap[s.name] = s; });
    const duoPlayerMap = {};
    duoData.players.forEach(d => { duoPlayerMap[d.name] = d; });

    const singleItems = playersData.map((p, i) => {
      const s = singleMap[p.name] || {};
      return { id: 10000 + i, type: 'single', name: p.name, card_img: p.card_img,
               players: p.players, price: s.price ?? 0, status: s.status || 'available' };
    });

    const duoPlayerItems = playersData.map((p, i) => {
      const d = duoPlayerMap[p.name] || {};
      return { id: 5000 + i, type: 'duo', name: p.name, card_img: p.card_img,

    allItems = [...singleItems, ...duoPlayerItems, ...duoComboItems];

  buildIndex();
}

function buildIndex() {
  tagIndex = {};

      if (!tagIndex[tag]) tagIndex[tag] = [];

    });
  });
}

/* ── FILTER LOGIC ── */
function computeFiltered() {
  let res = allItems.filter(p =>
    p.type === mode && p.status !== 'sold' &&
    (mode !== 'duo' || p.players.length > 1)
  );

  if (mode === 'duo' && selected.size > 0) {
    res = res.filter(p => [...selected].every(tag => p.players.includes(tag)));
  }

  if (query) {
    const q = query.toLowerCase();
    res = res.filter(p => {
      const name = (p.name || '').toLowerCase();
      const players = (p.players || []).map(x => x.toLowerCase());
      return name.includes(q) || players.some(x => x.includes(q));
    });
  }

  if (sortOrder === 'price_desc') res = [...res].sort((a, b) => b.price - a.price);
  else if (sortOrder === 'price_asc') res = [...res].sort((a, b) => a.price - b.price);

  return res;
}

/* ── UNIQUE TAGS FOR CURRENT MODE ── */
function tagsForMode() {
  const seen = new Set();
  const out  = [];
  allItems
    .filter(p => (mode === 'duo' ? (p.type === 'duo' && p.players.length === 1) : p.type === mode) && p.status !== 'sold')
    .forEach(p => {
      (p.players || []).forEach(tag => {
        if (!seen.has(tag)) { seen.add(tag); out.push(tag); }
      });
    });
  return out;
}

/* ── RENDER FILTER ICONS ── */
function renderFilters() {

    const seen = new Set();

    filtered.forEach(item => {
      (item.players || []).forEach(t => {
        if (!seen.has(t)) { seen.add(t); out.push(t); }
      });
    });
    tags = query ? out.filter(t => t.toLowerCase().includes(query)) : out;
  } else {
    const allTags = tagsForMode();
    tags = query ? allTags.filter(t => t.toLowerCase().includes(query)) : allTags;
  }

  if (mode === 'single' && sortOrder !== 'default') {
    tags = [...tags].sort((a, b) => {
      const pa = allItems.find(p => p.type === 'single' && p.name === a)?.price ?? 0;
      const pb = allItems.find(p => p.type === 'single' && p.name === b)?.price ?? 0;
      return sortOrder === 'price_desc' ? pb - pa : pa - pb;
    });

  tags.forEach(tag => {

    btn.className = 'fBtn' + (selected.has(tag) ? ' active' : '');
    btn.dataset.tag = tag;
    btn.title = tag;

      pEl.className = 'fPrice';
      pEl.textContent = item?.price ? item.price + ' บาท' : '';
      btn.append(imgWrap, pEl, lbl);
    } else {
      btn.append(imgWrap, lbl);
    }

    btn.addEventListener('click', () => toggleTag(tag, btn));
    frag.appendChild(btn);
  });

  fg.appendChild(frag);
}

/* ── TOGGLE TAG ── */
function toggleTag(tag, btn) {

    runFilter(true);
    renderFilters();
  }
}

/* ── DIVIDER DRAG ── */
function initDivider() {
  const divider = document.getElementById('divider');
  const topZone = document.getElementById('topZone');
  let dragging = false, startY = 0, startH = 0;

  function startDrag(y) {
    dragging = true;
    startY = y;
    startH = topZone.getBoundingClientRect().height;
  }
  function moveDrag(y) {
    if (!dragging) return;
    const delta = y - startY;
    const newH  = Math.max(80, Math.min(window.innerHeight - 80, startH + delta));
    topZone.style.flex = '0 0 ' + newH + 'px';
  }
  function endDrag() { dragging = false; }

  divider.addEventListener('mousedown',  e => { startDrag(e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => moveDrag(e.clientY));
  document.addEventListener('mouseup',   endDrag);

  divider.addEventListener('touchstart', e => { startDrag(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (dragging) { moveDrag(e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
  document.addEventListener('touchend',  endDrag);
}

/* ── EVENTS ── */
function initEvents() {
  /* mode tabs */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.mode === mode) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      mode = tab.dataset.mode;
      document.body.classList.toggle('mode-duo', mode === 'duo');
      document.getElementById('topZone').style.flex = '';
      selected.clear();
      query = '';
      document.getElementById('searchInput').value = '';
      renderFilters();
      runFilter();
    });
  });

  /* search */
  document.getElementById('searchInput').addEventListener('input', e => {
    query = e.target.value.toLowerCase().trim();
    renderFilters();
    runFilter(true);
  });

  /* sort */
  document.getElementById('sortDesc').addEventListener('click', () => {
    sortOrder = sortOrder === 'price_desc' ? 'default' : 'price_desc';
    updateSortBtns();
    renderFilters();
    runFilter();
  });
  document.getElementById('sortAsc').addEventListener('click', () => {
    sortOrder = sortOrder === 'price_asc' ? 'default' : 'price_asc';
    updateSortBtns();
    renderFilters();
    runFilter();
  });


  /* clear */
  document.getElementById('clearBtn').addEventListener('click', () => {
    selected.clear();
    query = '';
    sortOrder = 'default';
    document.getElementById('searchInput').value = '';
    updateSortBtns();
    renderFilters();
    runFilter();
  });

  /* infinite scroll */
  document.getElementById('resultZone').addEventListener('scroll', e => {
    const el = e.currentTarget;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 300) {
      if (page * PAGE_SIZE < filtered.length) {
        page++;
        renderGrid(false);
      }
    }
  }, { passive: true });

  /* modal close */
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

/* ── INIT ── */

  await loadData();

})();
